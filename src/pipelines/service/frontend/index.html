<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="네일 사진 한 장으로 이달의 아트 게시물을 만들어 보세요.">
  <title>원컷 네일 | 사진 1장이면 끝</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./landing.css">
  <script src="./app.js?v=email-auth" type="module"></script>
</head>
<body class="landing-page">
  <div class="first-screen">
    <header class="site-header">
      <a class="brand brand-wordmark" href="./" aria-label="원컷 네일 홈">onecut</a>
      <button class="landing-menu-toggle" type="button" aria-expanded="false" aria-controls="landing-account" aria-label="계정 메뉴">
        <span aria-hidden="true"></span>
      </button>
      <nav id="landing-account" aria-label="계정">
        <button class="button button-plain" type="button" data-guest data-auth="로그인">로그인</button>
        <a class="button button-outline" href="./mypage.html" data-account hidden>마이페이지</a>
        <button class="button button-plain" type="button" data-account data-logout hidden>로그아웃</button>
        <p class="auth-status" data-logout-status role="status"></p>
      </nav>
    </header>

    <main id="main">
      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title">사진 <span class="brand-title-accent">1장</span>이면 끝</h1>
        <p>네일 사진 한 장으로 이달의 아트 게시물을 만들고 인스타그램에 올리세요.</p>
        <a class="button button-primary button-brand" href="./create.html" data-auth-create>
          광고 만들기 <span aria-hidden="true">↗</span>
        </a>

        <figure class="demo">
          <figcaption>원컷 네일 작업 미리보기 <span>추후 영상으로 대체</span></figcaption>
          <!-- 촬영본이 준비되면 작업 예시를 video 요소로 교체합니다. -->
          <ol class="landing-workflow">
            <li>
              <h2>사진 첨부</h2>
              <div class="nail-swatch" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
              <p>모든 디자인 39,000원</p>
            </li>
            <li>
              <h2>이미지 생성</h2>
              <div class="workflow-art">
                <div class="demo-price"><span>이달의 아트</span><strong>39,000원</strong></div>
                <div class="nail-swatch result-swatch" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
              </div>
            </li>
            <li class="workflow-publish">
              <h2>게시 미리보기</h2>
              <div class="nail-swatch publish-swatch" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
              <p>이달의 네일 아트를 소개합니다.<br>#이달의아트 #네일아트</p>
            </li>
          </ol>
        </figure>
      </section>
    </main>
  </div>

  <section class="gallery" aria-labelledby="gallery-title">
    <div class="gallery-inner">
      <h2 id="gallery-title">원컷 네일로 만든 게시물</h2>
      <p>사진 한 장에서 생성되는 가격표와 네일팁 이미지입니다.</p>
      <div class="gallery-grid">
        <!-- 실제 결과물을 연결할 때 각 .image-placeholder를 img 요소로 교체합니다. -->
        <figure>
          <div class="image-placeholder price-preview" aria-hidden="true"><i></i></div>
          <figcaption>가격표 <span>예시</span></figcaption>
        </figure>
        <figure>
          <div class="image-placeholder nail-preview" aria-hidden="true"><i></i></div>
          <figcaption>네일팁 이미지 1 <span>예시</span></figcaption>
        </figure>
        <figure>
          <div class="image-placeholder nail-preview alternate" aria-hidden="true"><i></i></div>
          <figcaption>네일팁 이미지 2 <span>예시</span></figcaption>
        </figure>
      </div>
    </div>
  </section>

</body>
</html>
