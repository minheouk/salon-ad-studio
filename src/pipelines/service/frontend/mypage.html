<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>채팅 내역 | 원컷 네일</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./mypage.js" type="module"></script>
</head>
<body>
  <div class="create-layout">
    <aside class="create-sidebar">
      <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">✳</span> 원컷 네일</a>
      <nav aria-label="작업 메뉴">
        <a class="button button-outline" href="./create.html" id="new-chat">새 광고 만들기</a>
        <a class="button button-plain" href="./mypage.html" aria-current="page">마이페이지</a>
      </nav>
    </aside>
    <main class="create-main">
      <h1>채팅 내역</h1>
      <p id="chat-count" class="preview-note"></p>
      <p class="preview-note" id="chat-retention"></p>
      <ul id="chat-list" class="chat-list"></ul>
      <p id="chat-notice" role="status"></p>
    </main>
  </div>

  <dialog class="auth-dialog workflow-dialog" id="chat-delete" aria-labelledby="chat-delete-title">
    <h2 id="chat-delete-title">이 채팅을 삭제하시겠어요?</h2>
    <p>프롬프트, 첨부 이미지, 광고 결과와 입력 정보가 삭제됩니다. 인스타그램에 게시한 게시물은 그대로 유지됩니다.</p>
    <p>삭제한 채팅은 복구할 수 없습니다.</p>
    <form method="dialog" class="workflow-actions">
      <button class="button button-outline" value="cancel">취소</button>
      <button class="button button-primary" value="delete">채팅 삭제</button>
    </form>
  </dialog>
  <dialog class="auth-dialog workflow-dialog" id="chat-limit" aria-labelledby="chat-limit-title">
    <h2 id="chat-limit-title">채팅 저장 한도에 도달했습니다</h2>
    <p>새 광고를 만들려면 삭제할 채팅을 선택해 주세요.</p>
    <form id="chat-limit-form">
      <fieldset id="chat-limit-options" class="chat-limit-options"><legend>삭제할 채팅</legend></fieldset>
      <div class="workflow-actions">
        <button class="button button-outline" id="cancel-limit" type="button">취소</button>
        <button class="button button-primary" type="submit">삭제하고 새 광고 만들기</button>
      </div>
    </form>
  </dialog>
</body>
</html>
