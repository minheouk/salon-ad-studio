# ==============================================================================
#  네일샷 AI 설정 파일  (E:\nailshot_ai 수정본\settings.yaml)
#  - 여기 값을 고치고 저장한 뒤 서버를 다시 시작하면 적용돼요.
#  - API 키는 여기 넣지 마세요. 키는 .env 파일에만 (OPENAI_API_KEY=sk-...)
#  - 적용 순서: 실행 옵션(--model, --effort 등)  >  이 파일  >  .env  >  기본값
#  - 따옴표는 없어도 돼요. '#' 뒤는 설명(무시됨)이에요. 들여쓰기(빈칸 2개)는 지켜 주세요.
# ==============================================================================

openai:
  # 쓸 이미지 모델
  #   gpt-image-1-mini        가장 저렴 (품질 낮음)
  #   gpt-image-1.5           디자인을 충실히 따라가요 (기본)
  #   gpt-image-2             최신, 출력이 조금 더 저렴
  #   gpt-image-2.6-sunburst  / gpt-image-2.6-flare   아래 complexity 지원
  #   (gpt-image-1 은 2026-10-23 종료)
  model: gpt-image-2

  # 구상 강도 = "Reasoning effort" 역할. 그리기 전에 얼마나 계획할지. 추가 요금 없음.
  #   low | medium | high      비워 두면("") 모델 기본값
  #   지원하지 않는 모델이면 서버가 자동으로 빼고 보내요.
  complexity: ""

  # 입력 사진(손/디자인)을 얼마나 그대로 따를지
  #   auto  gpt-image-1.5 에서만 high 로 보내요 (추천)
  #   high | low   직접 지정 (지원 안 하는 모델이면 자동으로 빠져요)
  #   off   보내지 않음
  input_fidelity: high

# 웹 화면 버튼별 품질 (비용에 가장 큰 영향)
#   low | medium | high   (gpt-image-2.5 계열은 xhigh | max 도 가능)
quality:
  fast: low        # '빠르게' 버튼
  normal: medium   # '기본' 버튼
  high: high       # '고화질' 버튼

request:
  design_max_size: 1024   # 디자인 사진을 이 크기(px) 안으로 줄여 보내요. 작을수록 입력 토큰↓
  concurrency: 2          # 동시에 OpenAI 로 보내는 요청 수
  timeout_sec: 240        # OpenAI 응답을 기다리는 최대 시간(초)
  zoom_to_nails: true     # 손톱 주변만 잘라 크게 보내요 -> 손톱이 크게 보여 더 잘 그려요 (추천 true)
  zoom_padding: 0.25      # 잘라낼 때 손톱 영역 둘레에 남길 여유 (0.15~0.5). 클수록 손가락이 더 보여요
  align: true             # API 가 손 위치를 살짝 옮겨 그려도 원본에 맞춰 붙여요 (검은 손톱 방지, 추천 true)

  # --- 속도 ---
  partial_images: 2       # 그리는 중간 그림을 몇 번 미리 보여 줄지 (0~3). 0 이면 완성될 때까지 대기 화면
                          #   중간 그림마다 출력 토큰이 조금 더 붙을 수 있어요 (비용은 결과 아래에 표시)
  canvas_long_side: 1024  # gpt-image-2 / 2.5 계열만: 그릴 그림의 긴 변(px). 작을수록 빠르고 저렴 (768~1536)
                          #   다른 모델은 1024x1024 / 1024x1536 / 1536x1024 중에서 자동 선택
  api_output_format: webp # OpenAI 가 돌려주는 그림 형식 webp | jpeg | png. webp 가 가장 작아서 빨라요

server:
  port: 8000          # 웹 주소 http://localhost:8000
  lan: false          # true 면 같은 와이파이의 휴대폰 등에서도 접속 가능
  hide_cost: false    # true 면 웹 화면에서 비용 숨김 (서버 창/usage_log.csv 기록은 그대로)
  result_format: jpeg # 웹 화면으로 보내는 결과 형식 jpeg(빠름, 고품질 95) | png(무손실, 파일 큼)
  api_docs: true      # true 면 http://localhost:8000/docs 에서 API 명세(입력/출력 형식)를 보고 바로 시험해 볼 수 있어요
                      #   손님에게 공개(lan: true)할 때는 false 추천

design_analysis:
  # 1단계: 사용자가 올린 아무 사진(인스타 캡처, 손 사진 등)에서 네일 디자인을 먼저 인식해요.
  #   -> 디자인 설명(색/무늬/장식/마감)을 만들고, 손톱이 잘 보이는 부분만 잘라 2단계(이미지 생성)에 넘겨요.
  #   같은 사진으로 '다시' 누르면 인식 결과를 재사용해서 인식 비용은 다시 안 들어요.
  enabled: true
  # 인식 모델 (사진을 볼 수 있는 모델). 가격은 prices.json 의 text_models
  #   gpt-5.4-nano  가장 저렴      gpt-5.4-mini  추천 (가격/정확도 균형)      gpt-5.4 / gpt-5.5  더 정확, 비쌈
  model: gpt-6-luna
  # Reasoning effort (인식 단계는 진짜 추론 강도 옵션이 있어요)
  #   none | minimal | low | medium | high | xhigh | max     비워 두면("") 모델 기본값
  #   높을수록 꼼꼼하지만 추론 토큰이 늘어 비용/시간이 늘어요. 지원 안 하면 자동으로 빼고 보내요.
  reasoning_effort: medium   # 디자인 인식 · 팁 끝 모양 판별 · 손 고르기 (팁 다시 확인은 코드에서 low 고정)
  crop_reference: true       # 인식한 '디자인이 가장 잘 보이는 부분'만 잘라 참고 이미지로 써요
  reject_if_no_nails: true   # 사진에 손톱/네일이 없으면 생성하지 않고 안내해요 (이미지 생성 비용 절약)
  choose_hand: true          # 인식할 때 hands 폴더의 손 사진(번호 붙인 모음 1장)도 같이 보여 주고,
                             #   디자인에 가장 어울리는 손을 고르게 해요 (같은 호출이라 추가 호출 없음, 입력 토큰 약간↑)

nail_extend:
  # 길고 뾰족한 네일 디자인을 손톱 끝이 잘리지 않게 전부 그리기
  #   손 사진의 손톱 마스크는 원래 짧은 손톱 크기라서, 그대로면 손끝에서 잘리고 뭉툭해져요.
  #   -> 인식한 길이(nail_length)·모양(nail_shape)대로 손톱 영역을 손가락 방향으로 늘이고 끝을 좁혀서 그려요.
  #   손톱이 사진 밖으로 나가면 배경을 그만큼 넓혀요 (결과 사진이 원본보다 조금 커질 수 있어요).
  #   화면에서 길이/모양을 직접 고를 수도 있어요 (자동 = 아래 비율 사용).
  enabled: true      # false 면 '자동'일 때 원래 길이 그대로 (직접 고르면 그 값대로)
  medium: 0.4        # 늘이는 길이 = 손 사진 손톱 길이 x 이 숫자 (0~3)
  long: 0.95
  extra_long: 1.5

banner:
  # 첫 화면(http://localhost:8000): 네일 사진 1~5장 -> 장마다
  #   ① 인식 모델이 디자인 인식 + 손 고르기  ② 이미지 모델이 그 손에 네일 입히기
  #   ③ 인식 모델이 네일 입힌 사진을 보고 배경·배너 계획서  ④ 이미지 모델이 그 손 사진으로 배너
  #   (예전 화면: http://localhost:8000/single)
  size: 1024x1280            # 배너 크기 '가로x세로' (4:5). 결과는 항상 4:5 로 잘라서 내보내요. gpt-image-2 는 아무 크기(16의 배수로 맞춰요),
                             #   다른 모델은 1024x1024 / 1536x1024 / 1024x1536 중 가장 가까운 것
  max_designs: 1             # 한 번에 올릴 수 있는 사진 수 (1~5). 지금은 1장만
  plan_model: ""             # 계획서 모델. 비우면 design_analysis.model (gpt-6-luna)
  plan_reasoning_effort: low # none | minimal | low | medium | high | xhigh | max | ""  (화면에서 단계별로 바꿀 수 있어요)
  text_on_image: true        # true = 배너에 한글 문구(제목/부제/버튼)를 그려 넣어요. false = 문구 자리만 비워 둠
  apply_mode: scene          # ② 네일 입히는 방식 (화면에서 바꿀 수 있어요)
                             #   scene  = nailhand 폴더의 장면 사진(손 + 음료/향수) 중 디자인 분위기에 맞는 폴더 -> 사진 1장을 골라
                             #            손톱을 새 디자인으로, 음료 색과 배경도 디자인에 맞게 바꿔요 (마스크 없음)
                             #            폴더 이름 '분위기(키워드,키워드)' 가 고르는 기준이에요. 폴더/사진을 늘려도 돼요
                             #   mask   = 손톱 마스크로 손톱만 그려 원본 손 사진에 붙여요 (손·배경 원본 그대로, 가장 정확)
                             #   free   = 마스크 없이 손 사진 + 디자인으로 통째로 다시 그려요 (hands 에 사진만 넣으면 됨)
                             #   direct = ② 없이 ④ 배너에서 맨손 + 디자인으로 한 번에 (이미지 생성 1번, 비용·시간 약 절반)
  # ── 팁 세트 흐름 ─────────────────────────────────────────────────────────────────────────────
  #   ① luna 가 팁 세트를 인식 (팁 순서 · 방향 · 디자인) + 분위기 폴더(빨강 -> 레드와인 ...)와 그 안의 사진 1장을 골라요
  #   ② nailhand/hand_side.json 에서 그 사진의 손(왼손/오른손)을 읽어요. 씌울 손가락 · 손톱 끝/뿌리 방향은
  #      nailhand/nail_positions.json 만 보고 정해요 (nailhand JSON 은 읽기만)
  #   ③ reference/hand_side.json 에서 같은 손인 참조용 손 사진을 골라, reference JSON 4개(읽기만)의 손톱 자리에
  #      팁을 엄지~새끼 순서 · 방향대로 씌워요 (Image-2, 기본 품질 = quality.normal)
  #   ④ Image-2 가 팁 사진은 보지 않고, ③의 팁 씌운 참조용 손만 보고 레퍼런스 손톱에 그대로 씌워요.
  #      배경과 음료는 luna 가 인식한 팁 디자인을 참고해 바꿔요
  #   ⑤ ③의 사진을 결과 아래 빈 곳에 동그랗게 넣어요
  tip_paste: false           # true = 배경 · 음료도 바꾸지 않고 팁만 그대로 붙여요 (이미지 생성 없음)
  tip_paste_after: true      # 팁 세트 장면: ① 프로그램이 팁을 nailhand JSON(손톱 끝/뿌리) 자리에 대략 얹어요 (손가락 순서 · 위아래 안내용)
                             #   ② Image-2 가 그 사진 + 팁 하나씩 사진을 보고 레퍼런스 손톱 모양 · 곡률 · 빛에 맞게 자연스럽게 녹여 다시 그려요
                             #      (같은 호출에서 배경 · 음료도 바꿈, 생성 1번). 결과 = 모델이 다듬은 사진 그대로
                             #   false = 얹지 않고 Image-2 가 팁 사진만 보고 손톱을 그려요
  original_ratio: 80         # Image-2 가 손톱을 그릴 때 [올린 팁 세트 원본 사진] vs [잘라낸 팁(엄지~새끼)] 중 원본을 따르는 비율 (0~100)
                             #   100 = 디자인 · 모양 · 파츠는 원본 사진에서, 잘라낸 팁은 어느 손가락에 어떤 팁인지만 (아주 흐리게 얹음)
                             #    50 = 둘 다: 잘라낸 팁으로 손가락 · 배치, 원본으로 색 · 파츠 확인과 잘린 곳 고치기
                             #     0 = 잘라낸 팁만 (원본 사진을 보내지 않아요 - 예전 방식)
                             #   장면 사진과 동그란 사진 모두에 적용돼요
  natural_level: 60          # 레퍼런스 장면 사진에 네일을 얼마나 자연스럽게 입힐지 (0~100, 동그란 사진에는 영향 없음)
                             #     0 = 원본 그대로: 디자인을 정확히 복사 (엄격한 지시, 붙인 팁 진하게)
                             #    50 = 균형: 디자인은 알아볼 수 있게, 손톱 모양 · 곡률 · 빛은 레퍼런스에 맞게 다시 그림
                             #   100 = 자연스러움 최우선: '진짜 손에 한 네일' 느낌 먼저, 잔 디테일은 부드럽게 단순화될 수 있음 (붙인 팁 아주 흐리게)
                             #   (0~33 / 34~66 / 67~100 구간으로 지시가 바뀌고, 붙인 팁 진하기는 값에 따라 조금씩 바뀌어요)
  guide_left: ""             # "" = reference/hand_side.json 에서 left 인 사진을 자동으로 (지금: 실버 콤팩트를 든 핑크 네일-1.png)
  guide_right: ""            # "" = reference/hand_side.json 에서 right 인 사진을 자동으로 (지금: 은빛 거울을 든 누드 핑크 네일-2.png)
  guide_quality: medium      # 동그란 사진 품질: low = 빠르게(저렴), medium = 기본
  guide_model: true          # 동그란 사진: reference/ JSON(손 · 손톱 끝 · 뿌리) + 인식한 팁으로 참조용 손에 Image-2(기본 품질)가 따로 씌워요
                             #   false = 팁을 그대로 붙인 그림 (요금 없음)
  tip_guide: false           # 장면 생성은 동그란 사진(참조용 손)을 보지 않아요 - 팁 사진 · 순서 · nailhand JSON 만 봐요
                             #   true = 장면 생성에도 그 사진을 '낀 모습 예시'로 보내요
  guide_inset: true          # ⑤ 결과 사진에 ③의 사진을 동그랗게 넣어요 (크림색 테두리 · 손톱을 가리지 않는 밋밋한 자리)
  tip_change_drink: true     # 팁 세트일 때 음료 색도 바꿔요. false = 음료는 그대로, 배경만
  scene_banner: false        # scene 방식일 때: false = 바꾼 장면 사진이 완성품 (③④ 건너뜀, 이미지 생성 1번)
                             #                  true  = 그 장면 사진으로 ③ 계획서 + ④ 배너까지 (자세는 그대로)
  pose: auto                 # auto = ③ 계획서가 디자인에 맞는 손 자세를 정하고 ④ 배너에서 그 자세로 바꿔요
                             #        (긴 손톱 -> 길게 뻗은 측면, 3D 장식 -> 비스듬히, 전체 아트 -> 손등 펼침 등.
                             #         원본 디자인 사진을 같이 보내 디자인을 지키지만, 손가락을 다시 그려서 조금 달라질 수 있어요)
                             # keep = 네일 입힌 손의 자세 그대로 (디자인이 가장 정확). 화면에서 바꿀 수 있어요
  brand: ""                  # 배너에 넣을 상호명 기본값 (화면에서 바꿀 수 있어요). 비우면 넣지 않음

debug:
  save_images: true   # outputs_api 폴더에 보낸 사진/마스크/API 원본/결과를 저장 (결과가 이상할 때 원인 확인용)

sheet:
  # 팁 모음 사진: 사진 1장에 네일 팁 세트(보통 5개씩)가 여러 줄 있을 때 (화면의 '팁 모음 사진 · 세트 나누기')
  #   ⓪ 인식 모델이 세트마다 팁 위치를 찾고 -> 세트마다 그 줄만 또렷하게 잘라 -> 세트 하나 = 결과 1장
  #   (예: 5개씩 7줄 = 35개 -> 7장)
  #   손가락 순서 (통일 규칙): 한 줄의 팁을 왼쪽부터 1~5번이라 하면
  #     오른손: 1번(왼쪽 끝)부터 엄지, 검지, 중지, 약지, 새끼
  #     왼손  : 똑같이 1번 엄지 ... 5번 새끼 (뒤집지 않아요. 손에서는 5 새끼 · 4 약지 · 3 중지 · 2 검지 · 1 엄지 순으로 놓여요)
  #   레퍼런스(nailhand) 손 정보는 서버가 읽기만 해요 (자동 인식 · 저장 없음, 직접 고치고 서버 다시 켜기):
  #     nailhand/hand_fingers.json(손가락별 손톱 위치) · hand_side.json(왼손/오른손) · thumb_visible.json(엄지 보임)
  #     각 손가락에 배정된 팁을 레퍼런스의 같은 손가락 손톱 자리에 입혀요 (안 보이는 손가락의 팁은 안 씀)
  enabled: true
  max_sets: 12             # 한 번에 만드는 최대 장수 (1~30). 넘는 세트는 빼요 (비용 보호)
  reasoning_effort: medium # 세트 찾기 Reasoning effort. 위치를 정확히 찾아야 해서 medium 추천
  skip_incomplete: true    # 사진 가장자리에서 잘린 세트는 빼요
